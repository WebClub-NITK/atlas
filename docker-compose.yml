services:
  db:
    image: postgres:16.4-bullseye
    container_name: atlas_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 3s
      timeout: 60s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: atlas_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas_frontend
    ports:
      - "80:4173"
    env_file:
      - .env
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas_backend
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      CHALLENGE_NETWORK: ${CHALLENGE_NETWORK:-atlas-challenges}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
    networks:
      - app-network
      - challenge-net
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app-network:
    driver: bridge
  challenge-net:
    # Explicit name: challenge containers are started via the host docker
    # socket (siblings, not compose services), so they must join this network
    # by its real name rather than the compose-prefixed one.
    name: ${CHALLENGE_NETWORK:-atlas-challenges}
    driver: bridge
    # No route to the outside world: challenge containers are reachable only
    # from services on this network (the backend's WebSocket-SSH proxy).
    internal: true
